name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src scripts

  smoke-test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The three models (~500 MB+) don't change unless requirements.txt
      # or src/model.py does, so cache them across runs — without this,
      # every single run would re-download everything from Hugging Face.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('requirements.txt', 'src/model.py') }}

      - run: pip install -r requirements.txt

      - name: Start API in background
        working-directory: src
        run: nohup uvicorn api:app --host 127.0.0.1 --port 8000 &

      - name: Run smoke test against the live endpoints
        run: python scripts/smoke_test.py
